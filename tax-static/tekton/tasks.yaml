# Task 1: run Jasmine unit tests
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-jasmine-tests
spec:
  workspaces:
    - name: source
  steps:
    - name: npm-test
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm ci
        npm test
---
# Task 2: build the Docker image with Buildah and push it to the registry
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-and-push-image
spec:
  params:
    - name: IMAGE
      description: Full image name, e.g. us.icr.io/<namespace>/tax-calculator:latest
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -e
        buildah bud --storage-driver=vfs -t $(params.IMAGE) -f Dockerfile .
        buildah push --storage-driver=vfs $(params.IMAGE) docker://$(params.IMAGE)
