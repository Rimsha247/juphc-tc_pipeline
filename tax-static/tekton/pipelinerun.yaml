apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/YOUR-USERNAME/tax-calculator.git   # <-- CHANGE THIS
    - name: branch
      value: main
    - name: image
      value: us.icr.io/YOUR-NAMESPACE/tax-calculator:latest         # <-- CHANGE THIS
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: pipeline-pvc
