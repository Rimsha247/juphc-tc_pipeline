apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  params:
    - name: repo-url
      type: string
    - name: branch
      type: string
      default: main
    - name: image
      type: string
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone
      taskRef:
        name: git-clone          # ClusterTask on OpenShift / Skills Network lab. Install from Tekton Hub if missing.
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
    - name: test
      runAfter: [clone]
      taskRef:
        name: run-jasmine-tests
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build-push
      runAfter: [test]
      taskRef:
        name: build-and-push-image
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image)
