cat >> tekton/tasks.yaml << 'EOF'
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine
      image: node:slim
      workingDir: $(workspaces.source.path)
      command: ["npx"]
      args: ["jasmine"]
EOF
cat tekton/tasks.yaml
