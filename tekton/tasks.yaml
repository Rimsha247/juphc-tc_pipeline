cd /home/project/tax-calculator
cat >> tekton/tasks.yaml <<'EOF'
---
# Task: run any npm command
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  params:
    - name: ARGS
      description: The npm command to run, e.g. "install" or "test"
      type: string
      default: install
  workspaces:
    - name: source
  steps:
    - name: npm
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm $(params.ARGS)
EOF

git add tekton/tasks.yaml
git commit -m "Add npm Tekton task"
git push
